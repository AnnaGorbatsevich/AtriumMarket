components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads

        fs-task-processor:
            worker_threads: $worker-fs-threads

        producer-task-processor:
            thread_name: kafka-prod
            worker_threads: 2

    default_task_processor: main-task-processor

    components:
        server:
            listener:
                port: $server-port
                task_processor: main-task-processor

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard

        handler-hello:
            path: /hello
            method: GET,POST,OPTIONS
            task_processor: main-task-processor
        
        handler-add-basket:
            path: /add_basket
            method: POST,OPTIONS
            task_processor: main-task-processor
        
        handler-get-orders:
            path: /get_orders
            method: GET,OPTIONS
            task_processor: main-task-processor
        
        handler-get-basket:
            path: /get_basket
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-update-basket:
            path: /update_basket
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-checkout:
            path: /checkout
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-update-order-status:
            path: /update_order_status
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-reset-basket:
            path: /reset_basket
            method: POST,OPTIONS
            task_processor: main-task-processor


        testsuite-support: {}

        postgres-db:
            dbconnection#env: DB_CONNECTION_STRING
            blocking_task_processor: fs-task-processor

        secdist: {}

        default-secdist-provider:
            environment-secrets-key: SECDIST_CONFIG

        kafka-producer:
            delivery_timeout: 10s
            queue_buffering_max: 100ms
            enable_idempotence: true
            security_protocol: PLAINTEXT

        dns-client:
            fs-task-processor: fs-task-processor


config_vars: /app/configs/config_vars.yaml
