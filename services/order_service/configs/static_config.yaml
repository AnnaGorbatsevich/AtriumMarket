components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads

        fs-task-processor:
            worker_threads: $worker-fs-threads

    default_task_processor: main-task-processor

    components:
        server:
            listener:
                port: $server-port
                task_processor: main-task-processor

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard

        handler-hello:
            path: /hello
            method: GET,POST,OPTIONS
            task_processor: main-task-processor
        
        handler-add-basket:
            path: /add_basket
            method: POST,OPTIONS
            task_processor: main-task-processor
        
        handler-get-orders:
            path: /get_orders
            method: GET,OPTIONS
            task_processor: main-task-processor
        
        handler-get-basket:
            path: /get_basket
            method: GET,OPTIONS
            task_processor: main-task-processor
        

        testsuite-support: {}

        postgres-db:
            dbconnection#env: DB_CONNECTION_STRING
            blocking_task_processor: fs-task-processor

        dns-client:
            fs-task-processor: fs-task-processor


config_vars: /app/configs/config_vars.yaml
