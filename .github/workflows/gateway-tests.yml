name: gateway tests

on:
  push:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-tests.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/userver-framework/ubuntu-24.04-userver:latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(nproc)" --target gateway

      - name: Test
        run: |
          chown -R nobody:nogroup .
          su nobody -s /bin/sh -c 'HOME=/tmp ctest --test-dir build -V'
