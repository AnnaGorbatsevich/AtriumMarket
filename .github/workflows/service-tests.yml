name: service tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/userver-framework/ubuntu-24.04-userver:latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: |
          chown -R nobody:nogroup .
          su nobody -s /bin/sh -c 'HOME=/tmp ctest --test-dir build --output-on-failure'

      - name: Publish test summary
        if: always()
        run: |
          find build -name pytest-junit.xml | while read -r report; do
            heading=$(dirname "$report" | sed 's#^build/##')
            python3 .github/scripts/junit_to_summary.py "$report" "$heading" >> "$GITHUB_STEP_SUMMARY"
          done
