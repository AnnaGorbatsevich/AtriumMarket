name: Build and Push Images

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: frontend
            context: frontend
          - service: gateway
            context: gateway
          - service: user_service
            context: services/user_service
          - service: user-db
            context: services/user_service/db
          - service: listing_service
            context: services/listing_service
          - service: listing-db
            context: services/listing_service/db
          - service: order_service
            context: services/order_service
          - service: order-db
            context: services/order_service/db
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}-${{ matrix.service }}:sha-${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}-${{ matrix.service }}:latest
