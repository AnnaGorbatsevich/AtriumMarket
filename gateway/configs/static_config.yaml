components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads

        fs-task-processor:
            worker_threads: $worker-fs-threads

    default_task_processor: main-task-processor

    components:
        server:
            listener:
                port: $server-port
                task_processor: main-task-processor

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard

        handler-register:
            path: /register
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-hello:
            path: /hello
            method: GET,POST,OPTIONS
            task_processor: main-task-processor

        handler-login:
            path: /login
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-me:
            path: /me
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-add-product:
            path: /add_product
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-categories:
            path: /categories
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-products:
            path: /products
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-catalog:
            path: /catalog
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-add-basket:
            path: /add_basket
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-get-basket:
            path: /get_basket
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-get-orders:
            path: /get_orders
            method: GET,OPTIONS
            task_processor: main-task-processor

        handler-update-basket:
            path: /update_basket
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-update-profile:
            path: /update_profile
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-checkout:
            path: /checkout
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-update-order-status:
            path: /update_order_status
            method: POST,OPTIONS
            task_processor: main-task-processor

        http-client-core:
            fs-task-processor: fs-task-processor

        http-client: {}

        dns-client:
            fs-task-processor: fs-task-processor


config_vars: /app/configs/config_vars.yaml
