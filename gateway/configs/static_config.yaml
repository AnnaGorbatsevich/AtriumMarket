components_manager:
    task_processors:
        main-task-processor:
            worker_threads: $worker-threads

        fs-task-processor:
            worker_threads: $worker-fs-threads

    default_task_processor: main-task-processor

    components:
        server:
            listener:
                port: $server-port
                task_processor: main-task-processor

        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stderr'
                    level: $logger-level
                    overflow_behavior: discard

        handler-register:
            path: /register
            method: POST,OPTIONS
            task_processor: main-task-processor

        handler-hello:
            path: /hello
            method: GET,POST,OPTIONS
            task_processor: main-task-processor

        handler-login:
            path: /login
            method: POST,OPTIONS
            task_processor: main-task-processor

        http-client-core:
            fs-task-processor: fs-task-processor

        http-client: {}

        dns-client:
            fs-task-processor: fs-task-processor


config_vars: /app/configs/config_vars.yaml
