global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8081"]

  - job_name: user_service
    metrics_path: /metrics
    static_configs:
      - targets: ["user-service:8091"]

  - job_name: listing_service
    metrics_path: /metrics
    static_configs:
      - targets: ["listing-service:8071"]

  - job_name: order_service
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:8061"]

  - job_name: stats_service
    metrics_path: /metrics
    static_configs:
      - targets: ["stats-service:8051"]
