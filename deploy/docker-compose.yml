services:
  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

  gateway:
    build:
      context: ../gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: http://user-service:8090
      LISTING_SERVICE_URL: http://listing-service:8070
      ORDER_SERVICE_URL: http://order-service:8060
    depends_on:
      - user_service
      - listing_service
      - order_service

  user_service:
    build:
      context: ../services/user_service
    hostname: user-service
    ports:
      - "8090:8090"
    environment:
      JWT_SECRET: dev-only-secret-do-not-use-in-prod
      DB_CONNECTION_STRING: postgresql://user_service:devpassword@user-db:5432/atrium_users
    depends_on:
      - user-db
  

  listing_service:
    build:
      context: ../services/listing_service
    hostname: listing-service
    ports:
      - "8070:8070"
    environment:
      DB_CONNECTION_STRING: postgresql://listing_service:devpassword@listing-db:5432/atrium_listings
    depends_on:
      - listing-db
    

  order_service:
    build:
      context: ../services/order_service
    hostname: order-service
    ports:
      - "8060:8060"
    environment:
      DB_CONNECTION_STRING: postgresql://order_service:devpassword@order-db:5432/atrium_order
    depends_on:
      - order-db

  stats_service:
    build:
      context: ../services/stats_service
    hostname: stats-service
    ports:
      - "8050:8050"
    environment:
      SECDIST_CONFIG: '{"clickhouse_settings":{"clickhouse-database":{"hosts":["clickhouse-db"],"port":9000,"user":"default","password":"","dbname":"default"}}}'
    depends_on:
      clickhouse-db:
        condition: service_healthy

  clickhouse-db:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_DB: default
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - clickhouse-db-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"

  user-db:
    build:
      context: ../services/user_service/db
    environment:
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: atrium_users
    volumes:
      - user-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  listing-db:
    build:
      context: ../services/listing_service/db
    environment:
      POSTGRES_USER: listing_service
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: atrium_listings
    volumes:
      - listing-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  
  order-db:
    build:
      context: ../services/order_service/db
    environment:
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: atrium_order
    volumes:
      - order-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

volumes:
  user-db-data:
  listing-db-data:
  order-db-data:
  clickhouse-db-data:
