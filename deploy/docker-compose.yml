services:
  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

  gateway:
    build:
      context: ../gateway
    ports:
      - "8080:8080"

# postgres and user-service removed for now - services/user_service/ has no
# implementation at the moment (just an empty Dockerfile), and nothing else
# uses postgres. Re-add both once it's rebuilt.
