services:
  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

  gateway:
    build:
      context: ../gateway
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      USER_SERVICE_URL: http://user-service:8090
      LISTING_SERVICE_URL: http://listing-service:8070
      ORDER_SERVICE_URL: http://order-service:8060
      STATS_SERVICE_URL: http://stats-service:8050
    depends_on:
      - user_service
      - listing_service
      - order_service
      - stats_service

  user_service:
    build:
      context: ../services/user_service
    hostname: user-service
    ports:
      - "8090:8090"
      - "8091:8091"
    environment:
      JWT_SECRET: dev-only-secret-do-not-use-in-prod
      DB_CONNECTION_STRING: postgresql://user_service:devpassword@user-db:5432/atrium_users
    depends_on:
      - user-db
  

  listing_service:
    build:
      context: ../services/listing_service
    hostname: listing-service
    ports:
      - "8070:8070"
      - "8071:8071"
    environment:
      DB_CONNECTION_STRING: postgresql://listing_service:devpassword@listing-db:5432/atrium_listings
    depends_on:
      - listing-db
    

  order_service:
    build:
      context: ../services/order_service
    hostname: order-service
    ports:
      - "8060:8060"
      - "8061:8061"
    environment:
      DB_CONNECTION_STRING: postgresql://order_service:devpassword@order-db:5432/atrium_order
      SECDIST_CONFIG: '{"kafka_settings":{"kafka-producer":{"brokers":"kafka:9092","username":"","password":""}}}'
    depends_on:
      - order-db
      - kafka

  stats_service:
    build:
      context: ../services/stats_service
    hostname: stats-service
    ports:
      - "8050:8050"
      - "8051:8051"
    environment:
      SECDIST_CONFIG: '{"clickhouse_settings":{"clickhouse-database":{"hosts":["clickhouse-db"],"port":9000,"user":"default","password":"","dbname":"default"}},"kafka_settings":{"kafka-consumer":{"brokers":"kafka:9092","username":"","password":""}}}'
    depends_on:
      clickhouse-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ci4LkQfxRPiCu1CyWfoXhg
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse-db:
    build:
      context: ../services/stats_service/db
    environment:
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse-db-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-db:
    build:
      context: ../services/user_service/db
    environment:
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: atrium_users
    volumes:
      - user-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  listing-db:
    build:
      context: ../services/listing_service/db
    environment:
      POSTGRES_USER: listing_service
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: atrium_listings
    volumes:
      - listing-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  
  order-db:
    build:
      context: ../services/order_service/db
    environment:
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: atrium_order
    volumes:
      - order-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

volumes:
  user-db-data:
  listing-db-data:
  order-db-data:
  clickhouse-db-data:
